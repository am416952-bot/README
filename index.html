<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبات الكهرباء</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F2B600"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow order sheet; tab bar switches between rough-in and finishing; image preview at the bottom. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#14202B; --muted:#5B6B79; --line:#D5DCE2;
  --accent:#F2B600; --accent-ink:#241A00; --danger:#B3261E; --on:#FFF7DB;
  --font:'Cairo',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161E; --surface:#16212B; --ink:#E8EEF3; --muted:#93A3B1; --line:#2A3947;
    --accent:#F2B600; --accent-ink:#241A00; --danger:#FF8A80; --on:#2A2610; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161E; --surface:#16212B; --ink:#E8EEF3; --muted:#93A3B1; --line:#2A3947;
  --accent:#F2B600; --accent-ink:#241A00; --danger:#FF8A80; --on:#2A2610; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1{font-size:26px; line-height:1.2; margin:0; font-weight:700; text-wrap:balance}
.sub{margin:4px 0 0; color:var(--muted); font-size:14px}
.bar{height:6px; width:56px; background:var(--accent); border-radius:2px; margin-bottom:10px}
label.f{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); font-weight:600}
input[type=text],input[type=number],select,textarea{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; min-width:0; width:100%;
}
textarea{resize:vertical; min-height:72px}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--line); padding:4px; border-radius:10px}
.tab{
  font:inherit; font-weight:700; border:0; border-radius:7px; padding:10px 8px; cursor:pointer;
  background:transparent; color:var(--muted); display:flex; justify-content:center; align-items:center; gap:8px;
}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink)}
.badge{min-width:22px; height:22px; border-radius:11px; background:var(--accent); color:var(--accent-ink);
  font-size:13px; display:inline-flex; align-items:center; justify-content:center; padding:0 6px}
.badge[hidden]{display:none}
ul.list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.on{background:var(--on)}
.nm{flex:1; min-width:0; display:flex; flex-direction:column}
.nm .n{font-weight:600; overflow-wrap:anywhere}
.nm .u{font-size:13px; color:var(--muted)}
.step{display:flex; align-items:center; gap:6px; direction:ltr}
.step button{
  width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font:inherit; font-size:22px; line-height:1; cursor:pointer;
}
.step button.plus{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.step input{width:60px; text-align:center; padding:8px 4px; font-weight:700; font-variant-numeric:tabular-nums}
.del{border:0; background:transparent; color:var(--danger); font-size:22px; width:32px; height:40px; cursor:pointer}
.empty{padding:18px; text-align:center; color:var(--muted)}
.add{display:grid; grid-template-columns:1fr 110px auto; gap:8px; align-items:end}
.btn{
  font:inherit; font-weight:700; border-radius:10px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); padding:11px 16px; cursor:pointer;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:18px; padding:14px 16px}
.btn.danger{color:var(--danger)}
.actions{display:flex; flex-direction:column; gap:10px}
.sumline{display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums}
#status{min-height:1.5em; font-size:14px; color:var(--muted)}
.preview{display:flex; flex-direction:column; gap:8px}
.preview img{width:100%; height:auto; border:1px solid var(--line); border-radius:10px; background:#fff}
.preview[hidden]{display:none}
.confirm{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.confirm[hidden]{display:none}
.brand{display:flex; align-items:center; gap:14px}
.logo{width:76px; height:76px; flex:none; color:var(--ink)}
.bt{min-width:0}
.sub1{margin:0; font-weight:700; font-size:18px}
.ph{margin:2px 0 0; color:var(--muted); font-size:15px; font-variant-numeric:tabular-nums; user-select:all}
@media (prefers-reduced-motion: no-preference){ .row{transition:background .15s} }
</style>

</head><body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="brand">
    <svg class="logo" viewBox="-100 -100 200 200" aria-hidden="true">
      <circle r="88" fill="none" stroke="currentColor" stroke-width="10" opacity=".9"/>
      <polygon points="15,-85 -40,8 -2,8 -15,85 42,-12 4,-12" fill="#F2B600" stroke="#241A00" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <div class="bt">
      <h1>أبو عبد الظاهر</h1>
      <p class="sub1">لأعمال الكهرباء</p>
      <p class="ph">هاتف: <bdi dir="ltr">01223005099</bdi></p>
    </div>
  </header>
  <p class="sub" style="margin:-6px 0 0">طلبات الكهرباء · تأسيس وتشطيب</p>

  <label class="f" for="client">اسم العميل أو الشقة
    <input type="text" id="client" placeholder="مثال: شقة 12 · التجمع">
  </label>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-rough" data-tab="rough" aria-selected="true">التأسيس <span class="badge" id="b-rough" hidden>0</span></button>
    <button class="tab" role="tab" id="tab-finish" data-tab="finish" aria-selected="false">التشطيب <span class="badge" id="b-finish" hidden>0</span></button>
  </div>

  <ul class="list" id="list"></ul>

  <form class="add" id="addForm">
    <label class="f" for="newName">صنف جديد
      <input type="text" id="newName" placeholder="اسم الصنف">
    </label>
    <label class="f" for="newUnit">الوحدة
      <select id="newUnit">
        <option>قطعة</option><option>لفة</option><option>متر</option><option>كرتونة</option><option>عبوة</option>
      </select>
    </label>
    <button class="btn" type="submit">إضافة</button>
  </form>

  <label class="f" for="notes">ملاحظات
    <textarea id="notes" placeholder="أي تفاصيل للمورد"></textarea>
  </label>

  <div class="sumline"><span id="sumA"></span><span id="sumB"></span></div>

  <div class="actions">
    <button class="btn primary" id="saveImg" type="button">حفظ صورة الطلب</button>
    <button class="btn danger" id="resetBtn" type="button">تصفير الكميات</button>
    <div class="confirm" id="confirm" hidden>
      <span>تصفير كل الكميات؟</span>
      <button class="btn danger" id="yes" type="button">نعم، صفّر</button>
      <button class="btn" id="no" type="button">إلغاء</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="preview" id="preview" hidden>
    <img id="previewImg" alt="صورة الطلب">
    <div class="sub" id="previewHint"></div>
  </div>
</div>

<script>
(function(){
  var KEY='elec-order-v1';
  var uid=0;
  function mk(section,name,unit,qty,custom){ uid++; return {id:'i'+uid+'-'+Math.random().toString(36).slice(2,6),section:section,name:name,unit:unit,qty:qty||0,custom:!!custom}; }
  function defaults(){
    return [
      mk('rough','خرطوم 11','لفة'),
      mk('rough','خرطوم 13','لفة'),
      mk('rough','خرطوم 16','لفة'),
      mk('rough','علب مفاتيح','قطعة'),
      mk('finish','مفاتيح','قطعة'),
      mk('finish','سدادات','قطعة'),
      mk('finish','وشوش','قطعة'),
      mk('finish','جرس','قطعة'),
      mk('finish','مفتاح جرس','قطعة'),
      mk('finish','أباليك','قطعة'),
      mk('finish','أبليك مرآة','قطعة')
    ];
  }
  var state;
  try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.items)) state=s; }catch(e){}
  if(!state) state={items:defaults(),client:'',notes:'',tab:'rough'};
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  function esc(t){ return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function $(id){ return document.getElementById(id); }

  var list=$('list');

  function counts(){
    var r=0,f=0;
    state.items.forEach(function(i){ if(i.qty>0){ if(i.section==='rough') r++; else f++; } });
    return {rough:r,finish:f};
  }
  function updateSummary(){
    var c=counts();
    ['rough','finish'].forEach(function(k){
      var b=$('b-'+k); b.textContent=c[k]; b.hidden=c[k]===0;
    });
    $('sumA').textContent='أصناف التأسيس: '+c.rough;
    $('sumB').textContent='أصناف التشطيب: '+c.finish;
  }
  function render(){
    ['rough','finish'].forEach(function(k){
      var t=$('tab-'+k); t.setAttribute('aria-selected', String(state.tab===k));
    });
    var items=state.items.filter(function(i){return i.section===state.tab;});
    if(!items.length){ list.innerHTML='<li class="empty">لا توجد أصناف. أضف صنفًا من الأسفل.</li>'; }
    else list.innerHTML=items.map(function(i){
      return '<li class="row'+(i.qty>0?' on':'')+'" data-id="'+i.id+'">'+
        '<div class="nm"><span class="n">'+esc(i.name)+'</span><span class="u">'+esc(i.unit)+'</span></div>'+
        (i.custom?'<button class="del" data-act="del" aria-label="حذف '+esc(i.name)+'">×</button>':'')+
        '<div class="step">'+
          '<button type="button" data-act="dec" aria-label="نقص">−</button>'+
          '<input type="number" inputmode="numeric" min="0" max="9999" id="q-'+i.id+'" data-act="qty" value="'+i.qty+'" aria-label="الكمية">'+
          '<button type="button" class="plus" data-act="inc" aria-label="زيادة">+</button>'+
        '</div></li>';
    }).join('');
    updateSummary();
  }
  function setQty(item,row,q){
    q=Math.max(0,Math.min(9999,q|0));
    item.qty=q;
    var inp=row.querySelector('input'); if(inp && document.activeElement!==inp) inp.value=q;
    row.classList.toggle('on',q>0);
    updateSummary(); persist();
  }
  list.addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return;
    var row=b.closest('.row'); var item=state.items.find(function(i){return i.id===row.dataset.id;}); if(!item) return;
    var act=b.dataset.act;
    if(act==='inc') setQty(item,row,item.qty+1);
    else if(act==='dec') setQty(item,row,item.qty-1);
    else if(act==='del'){ state.items=state.items.filter(function(i){return i!==item;}); persist(); render(); }
  });
  list.addEventListener('input',function(e){
    var inp=e.target; if(inp.dataset.act!=='qty') return;
    var row=inp.closest('.row'); var item=state.items.find(function(i){return i.id===row.dataset.id;}); if(!item) return;
    setQty(item,row,parseInt(inp.value,10)||0);
  });
  list.addEventListener('focusout',function(e){
    var inp=e.target; if(inp.dataset && inp.dataset.act==='qty'){
      var row=inp.closest('.row'); var item=state.items.find(function(i){return i.id===row.dataset.id;});
      if(item) inp.value=item.qty;
    }
  });
  document.querySelector('.tabs').addEventListener('click',function(e){
    var t=e.target.closest('.tab'); if(!t) return; state.tab=t.dataset.tab; persist(); render();
  });
  $('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var n=$('newName').value.trim(); if(!n) return;
    state.items.push(mk(state.tab,n,$('newUnit').value,1,true));
    $('newName').value=''; persist(); render();
  });
  $('client').value=state.client||'';
  $('notes').value=state.notes||'';
  $('client').addEventListener('input',function(){ state.client=this.value; persist(); });
  $('notes').addEventListener('input',function(){ state.notes=this.value; persist(); });

  $('resetBtn').addEventListener('click',function(){ $('confirm').hidden=false; });
  $('no').addEventListener('click',function(){ $('confirm').hidden=true; });
  $('yes').addEventListener('click',function(){
    state.items.forEach(function(i){i.qty=0;}); $('confirm').hidden=true; persist(); render();
  });

  /* ---- image ---- */
  function wrapText(ctx,text,maxW){
    var out=[];
    String(text).split('\n').forEach(function(par){
      var words=par.split(' '), line='';
      words.forEach(function(w){
        var test=line?line+' '+w:w;
        if(ctx.measureText(test).width>maxW && line){ out.push(line); line=w; } else line=test;
      });
      out.push(line);
    });
    return out;
  }
  function drawLogo(ctx,cx,cy,r,ringColor,boltColor,boltStroke){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.beginPath(); ctx.arc(0,0,r*0.88,0,Math.PI*2);
    ctx.lineWidth=r*0.1; ctx.strokeStyle=ringColor; ctx.stroke();
    var pts=[[0.15,-0.85],[-0.4,0.08],[-0.02,0.08],[-0.15,0.85],[0.42,-0.12],[0.04,-0.12]];
    ctx.beginPath();
    pts.forEach(function(p,i){ if(i===0) ctx.moveTo(p[0]*r,p[1]*r); else ctx.lineTo(p[0]*r,p[1]*r); });
    ctx.closePath(); ctx.fillStyle=boltColor; ctx.fill();
    if(boltStroke){ ctx.lineWidth=r*0.04; ctx.lineJoin='round'; ctx.strokeStyle=boltStroke; ctx.stroke(); }
    ctx.restore();
  }
  function drawWatermark(ctx,cx,cy,r,F){
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,r*0.88,0,Math.PI*2);
    ctx.lineWidth=r*0.05; ctx.strokeStyle='rgba(20,32,43,0.14)'; ctx.stroke();
    var s=r*0.46, by=cy-r*0.42;
    var pts=[[0.15,-0.85],[-0.4,0.08],[-0.02,0.08],[-0.15,0.85],[0.42,-0.12],[0.04,-0.12]];
    ctx.beginPath();
    pts.forEach(function(p,i){ var x=cx+p[0]*s, y=by+p[1]*s; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.closePath(); ctx.fillStyle='rgba(242,182,0,0.34)'; ctx.fill();
    ctx.lineWidth=r*0.02; ctx.lineJoin='round'; ctx.strokeStyle='rgba(36,26,0,0.18)'; ctx.stroke();
    ctx.direction='rtl'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='rgba(20,32,43,0.16)';
    ctx.font='700 '+Math.round(r*0.17)+'px '+F;
    ctx.fillText('أبو عبد الظاهر',cx,cy+r*0.22);
    ctx.font='700 '+Math.round(r*0.145)+'px '+F;
    ctx.fillText('لأعمال الكهرباء',cx,cy+r*0.44);
    ctx.font='700 '+Math.round(r*0.14)+'px '+F;
    ctx.fillText('01223005099',cx,cy+r*0.66);
    ctx.restore();
  }
  async function renderImage(){
    try{ await document.fonts.load('700 34px Cairo'); await document.fonts.load('400 28px Cairo'); await document.fonts.load('600 30px Cairo'); }catch(e){}
    var W=1080, P=56, ROW=68, F='Cairo, Tahoma, sans-serif';
    var groups=[['rough','التأسيس'],['finish','التشطيب']].map(function(g){
      return [g[1],state.items.filter(function(i){return i.section===g[0] && i.qty>0;})];
    }).filter(function(g){return g[1].length;});
    var cv=document.createElement('canvas'); var ctx=cv.getContext('2d');
    ctx.font='400 28px '+F;
    var notesLines=state.notes.trim()?wrapText(ctx,state.notes.trim(),W-2*P):[];
    var H=300;
    groups.forEach(function(g){ H+=84+g[1].length*ROW+20; });
    if(!groups.length) H+=120;
    if(notesLines.length) H+=70+notesLines.length*42;
    H+=130; H=Math.max(H,1400);
    cv.width=W; cv.height=H;
    ctx=cv.getContext('2d');
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    /* transparent logo watermark across the whole sheet */
    var wr=300;
    drawWatermark(ctx,W/2,Math.min(H-wr-120,Math.round(H*0.62)),wr,F);
    ctx.fillStyle='#F2B600'; ctx.fillRect(0,0,W,20);
    ctx.direction='rtl'; ctx.textBaseline='alphabetic';
    var y=108;
    drawLogo(ctx,P+62,y-22,62,'#14202B','#F2B600','#241A00');
    ctx.fillStyle='#14202B'; ctx.textAlign='right'; ctx.font='700 56px '+F;
    ctx.fillText('أبو عبد الظاهر',W-P,y);
    y+=52; ctx.font='700 38px '+F;
    ctx.fillText('لأعمال الكهرباء',W-P,y);
    y+=48; ctx.font='600 32px '+F; ctx.fillStyle='#5B6B79';
    ctx.fillText('هاتف: 01223005099',W-P,y);
    y+=62; ctx.font='700 34px '+F; ctx.fillStyle='#14202B';
    ctx.fillText('طلبات الكهرباء',W-P,y);
    y+=46; ctx.font='400 30px '+F; ctx.fillStyle='#5B6B79';
    var client=state.client.trim();
    var date=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
    ctx.fillText((client?client+' · ':'')+date,W-P,y);
    y+=40; ctx.fillStyle='#D5DCE2'; ctx.fillRect(P,y,W-2*P,2); y+=20;
    if(!groups.length){
      ctx.fillStyle='#5B6B79'; ctx.textAlign='center'; ctx.font='400 30px '+F;
      ctx.fillText('لم يتم اختيار أي كميات',W/2,y+70); y+=120;
    }
    groups.forEach(function(g){
      y+=48;
      ctx.fillStyle='#F2B600'; ctx.fillRect(W-P-8,y-32,8,40);
      ctx.fillStyle='#14202B'; ctx.textAlign='right'; ctx.font='700 38px '+F;
      ctx.fillText(g[0],W-P-24,y);
      y+=36;
      g[1].forEach(function(it,idx){
        var base=y+ROW*0.68;
        if(idx%2===0){ ctx.fillStyle='#F4F6F8'; ctx.fillRect(P,y,W-2*P,ROW); }
        ctx.fillStyle='#14202B'; ctx.textAlign='right'; ctx.font='600 32px '+F;
        ctx.fillText(it.name,W-P-16,base);
        ctx.textAlign='left'; ctx.font='700 34px '+F;
        ctx.fillText(it.qty+' '+it.unit,P+16,base);
        y+=ROW;
      });
      y+=20;
    });
    if(notesLines.length){
      y+=40; ctx.fillStyle='#14202B'; ctx.textAlign='right'; ctx.font='700 32px '+F;
      ctx.fillText('ملاحظات',W-P,y); y+=14;
      ctx.font='400 28px '+F; ctx.fillStyle='#34424F';
      notesLines.forEach(function(l){ y+=42; ctx.fillText(l,W-P,y); });
    }
    ctx.fillStyle='#D5DCE2'; ctx.fillRect(P,H-96,W-2*P,2);
    ctx.fillStyle='#5B6B79'; ctx.textAlign='center'; ctx.font='600 28px '+F;
    ctx.fillText('أبو عبد الظاهر لأعمال الكهرباء · 01223005099',W/2,H-44);
    return new Promise(function(res){
      cv.toBlob(function(b){ res({blob:b,url:cv.toDataURL('image/png')}); },'image/png');
    });
  }
  var status=$('status');
  $('saveImg').addEventListener('click',async function(){
    status.textContent='جاري تجهيز الصورة...';
    var out;
    try{ out=await renderImage(); }catch(e){ status.textContent='تعذر تجهيز الصورة. حاول مرة أخرى.'; return; }
    $('previewImg').src=out.url; $('preview').hidden=false;
    var dl=null;
    try{ dl=(window.claude && window.claude.use)?await window.claude.use('downloads'):null; }catch(e){ dl=null; }
    if(dl && out.blob){
      try{
        await dl.save({filename:'electrical-order.png',data:out.blob});
        status.textContent='تم حفظ الصورة.';
        $('previewHint').textContent='';
      }catch(err){
        if(err && err.code==='declined'){ status.textContent='لم يتم الحفظ. الصورة جاهزة بالأسفل.'; }
        else{ status.textContent='تعذر الحفظ المباشر.'; }
        $('previewHint').textContent='اضغط مطوّلًا على الصورة واختر حفظ.';
      }
    }else{
      status.textContent='الصورة جاهزة بالأسفل.';
      $('previewHint').textContent='اضغط مطوّلًا على الصورة واختر حفظ.';
    }
    $('preview').scrollIntoView({behavior:'smooth',block:'nearest'});
  });

  render();
})();
</script>
